name: build-and-release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build (warnings are errors)
        run: dotnet build AVAMMB1.sln -c Release
      - name: Test
        run: dotnet test AVAMMB1.sln -c Release --no-build --logger "trx;LogFileName=results.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'

  publish:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64,     smoke: true }
          - { os: windows-latest, rid: win-arm64,   smoke: false }
          - { os: ubuntu-latest,  rid: linux-x64,   smoke: true }
          - { os: ubuntu-latest,  rid: linux-arm64, smoke: false }
          - { os: macos-latest,   rid: osx-arm64,   smoke: true }
          - { os: macos-latest,   rid: osx-x64,     smoke: false }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Version from tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_ENV"; fi

      - name: Publish (bash)
        if: runner.os != 'Windows'
        shell: bash
        env:
          RIDS: ${{ matrix.rid }}
          SKIP_TESTS: '1'
        run: ./build-all.sh

      - name: Publish (PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build-all.ps1 -Rids ${{ matrix.rid }} -SkipTests

      - name: Smoke test (Linux, headless)
        if: matrix.smoke && runner.os == 'Linux'
        run: ./dist/${{ matrix.rid }}/AVAMMB1 --smoke-test

      - name: Smoke test (Windows)
        if: matrix.smoke && runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/${{ matrix.rid }}/AVAMMB1.exe" -ArgumentList '--smoke-test' -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "smoke test failed: $($p.ExitCode)" }

      - name: Smoke test (macOS)
        if: matrix.smoke && runner.os == 'macOS'
        run: ./dist/${{ matrix.rid }}/AVAMMB1.app/Contents/MacOS/AVAMMB1 --smoke-test

      - name: Package (disk image / AppImage)
        if: runner.os != 'Windows'
        shell: bash
        run: ./packaging/package.sh ${{ matrix.rid }}

      - name: Package (installer)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/package.ps1 -Rid ${{ matrix.rid }} -Version "$env:VERSION"

      - name: Smoke test the AppImage
        if: matrix.smoke && runner.os == 'Linux'
        shell: bash
        run: ./dist/AVAMMB1-*-${{ matrix.rid }}.AppImage --appimage-extract-and-run --smoke-test

      - name: Smoke test the installer (silent install, then run)
        if: matrix.smoke && runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist/AVAMMB1-*-${{ matrix.rid }}-setup.exe | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP "avammb1-installed"
          $p = Start-Process -FilePath $setup.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/CURRENTUSER', "/DIR=$dir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer failed: $($p.ExitCode)" }
          $g = Start-Process -FilePath (Join-Path $dir "AVAMMB1.exe") -ArgumentList '--smoke-test' -Wait -PassThru -NoNewWindow
          if ($g.ExitCode -ne 0) { throw "installed game smoke test failed: $($g.ExitCode)" }

      - name: Smoke test the disk image
        if: matrix.smoke && runner.os == 'macOS'
        shell: bash
        run: |
          hdiutil attach -nobrowse -mountpoint /tmp/avammb1-dmg dist/AVAMMB1-*-${{ matrix.rid }}.dmg
          /tmp/avammb1-dmg/AVAMMB1.app/Contents/MacOS/AVAMMB1 --smoke-test
          hdiutil detach /tmp/avammb1-dmg

      - uses: actions/upload-artifact@v4
        with:
          name: AVAMMB1-${{ matrix.rid }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.dmg
            dist/*.AppImage
            dist/*-setup.exe

  flatpak:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64,  rid: linux-x64,   os: ubuntu-latest }
          - { arch: aarch64, rid: linux-arm64, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: AVAMMB1-${{ matrix.rid }}
          path: dist
      - name: Manifest
        id: manifest
        shell: bash
        run: |
          version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -1)"
          packaging/flatpak/make-manifest.sh flatpak-build dist/AVAMMB1-*-${{ matrix.rid }}.tar.gz
          echo "bundle=AVAMMB1-$version-${{ matrix.arch }}.flatpak" >> "$GITHUB_OUTPUT"
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: flatpak-build/io.github.Harlock123.AVAMMB1.yml
          bundle: ${{ steps.manifest.outputs.bundle }}
          arch: ${{ matrix.arch }}
          cache: false
          upload-artifact: false
      - name: Smoke test the Flatpak
        shell: bash
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.freedesktop.Platform//24.08
          flatpak install --user -y --noninteractive --bundle ${{ steps.manifest.outputs.bundle }}
          flatpak run io.github.Harlock123.AVAMMB1 --smoke-test
      - name: Collect
        shell: bash
        run: mkdir -p out && mv ${{ steps.manifest.outputs.bundle }} out/
      - uses: actions/upload-artifact@v4
        with:
          name: AVAMMB1-flatpak-${{ matrix.arch }}
          path: out/*.flatpak

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish, flatpak]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: AVAMMB1-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            Single-file, self-contained builds of AVAM&M (unofficial fan re-implementation), as plain
            archives and as packages: a Windows installer (-setup.exe), a macOS disk image (.dmg) and a
            Linux AppImage (.AppImage - make it executable and run it) and a Flatpak bundle
            (`flatpak install --user AVAMMB1-*.flatpak`, then run it from the menu or with
            `flatpak run io.github.Harlock123.AVAMMB1`).
            The installers are not code-signed: Windows SmartScreen may warn (More info -> Run anyway);
            macOS builds are ad-hoc signed but not notarized: right-click -> Open on first launch,
            or run `xattr -dr com.apple.quarantine AVAMMB1.app`.
